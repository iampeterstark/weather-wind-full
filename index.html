        }

            max-width: 800px;

// ===== 2. DOM 取得元素 =====
const stationSelect = document.getElementById('stationSelect');
const statusDiv     = document.getElementById('status');
const errorDiv      = document.getElementById('error');
const resultBox     = document.getElementById('resultBox');

const stationNameEl = document.getElementById('stationName');
const updateTimeEl  = document.getElementById('updateTime');
const windDirEl     = document.getElementById('windDir');
const windSpeedEl   = document.getElementById('windSpeed');
const windGustEl    = document.getElementById('windGust');

// ===== 3. 初始化下拉選單 =====
function initStationOptions() {
    geojson.features.forEach((feature, index) => {
        const opt = document.createElement('option');
        // 下拉選單顯示中文站名（自動氣象站_繁體）
        opt.textContent = feature.properties.AutomaticWeatherStation_uc;
        opt.value = index; // 用 index 來找對應 feature
        stationSelect.appendChild(opt);
    });
}

// ===== 4. 解析 CSV：只取最新一行 =====
// HKO 10min CSV 欄位：DateTime, Station, MeanDir, MeanSpeed, MaxGust [web:15]
function parseLatestRowFromCSV(csvText) {
    const lines = csvText.trim().split('\n');

    if (lines.length < 2) {
        throw new Error('CSV 資料不足');
    }

    // 第一行是標題，不要
    const dataLines = lines.slice(1);

    // 取最後一行做為「最新」資料
    const lastLine = dataLines[dataLines.length - 1];

    // 以逗號分隔欄位
    const cols = lastLine.split(',');

    if (cols.length < 5) {
        throw new Error('CSV 欄位數量不符預期');
    }

    const dateTime = cols[0].trim(); // YYYYMMDDHHMN
    const station  = cols[1].trim();
    const windDir  = cols[2].trim(); // 風向（羅經方位）
    const meanSpd  = cols[3].trim(); // 平均風速（km/h）
    const maxGust  = cols[4].trim(); // 最高陣風（km/h）

    return {
        dateTime,
        station,
        windDir,
        meanSpd,
        maxGust
    };
}

// 將 YYYYMMDDHHMN 轉成較好看的字串
function formatDateTime(yyyymmddhhmn) {
    if (yyyymmddhhmn.length !== 12) return yyyymmddhhmn;

    const y = yyyymmddhhmn.slice(0, 4);
    const m = yyyymmddhhmn.slice(4, 6);
    const d = yyyymmddhhmn.slice(6, 8);
    const hh = yyyymmddhhmn.slice(8, 10);
    const mn = yyyymmddhhmn.slice(10, 12);

    return `${y}-${m}-${d} ${hh}:${mn}`;
}

// ===== 5. 根據選擇的站點抓資料 =====
async function loadStationData(index) {
    const feature = geojson.features[index];
    if (!feature) return;

    const stationName = feature.properties.AutomaticWeatherStation_uc;
    const dataUrl = feature.properties.Data_url;

    statusDiv.textContent = `正在載入「${stationName}」的最新風況...`;
    errorDiv.textContent = '';
    resultBox.style.display = 'none';

    try {
        const response = await fetch(dataUrl);
        if (!response.ok) {
            throw new Error('HTTP 狀態碼 ' + response.status);
        }

        const csvText = await response.text();
        const latest = parseLatestRowFromCSV(csvText);

        stationNameEl.textContent = stationName;
        updateTimeEl.textContent  = formatDateTime(latest.dateTime);
        windDirEl.textContent     = latest.windDir || 'N/A';
        windSpeedEl.textContent   = latest.meanSpd ? latest.meanSpd + ' km/h' : 'N/A';
        windGustEl.textContent    = latest.maxGust ? latest.maxGust + ' km/h' : 'N/A';

        resultBox.style.display = 'block';
        statusDiv.textContent = '載入完成。';
    } catch (err) {
        console.error(err);
        errorDiv.textContent = '載入資料時發生錯誤：' + err.message;
        statusDiv.textContent = '';
    }
}

// ===== 6. 頁面載入時初始化 =====
window.addEventListener('DOMContentLoaded', () => {
    initStationOptions();

    // 預設載入第一個站
    if (geojson.features.length > 0) {
        stationSelect.value = 0;
        loadStationData(0);
    }

    stationSelect.addEventListener('change', () => {
        const index = parseInt(stationSelect.value, 10);
        loadStationData(index);
    });
});
</script>
